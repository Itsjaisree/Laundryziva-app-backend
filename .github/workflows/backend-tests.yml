name: AllZiva Backend Automated Tests

on:
  push:
    branches:
      - feature/technician-backend
      - main
  pull_request:
    branches:
      - feature/technician-backend
      - main
  workflow_dispatch:

jobs:
  test:
    name: Backend Test Suite (Node.js Runner)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run All Automated Test Cases One-by-One
        run: npm test
